services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    volumes:
      # Data ko safe rakhne ke liye volumes (taaki container band hone par data na ude)
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      # UI ko batayenge ki API 'api' naam ke container me chal rahi hai
      - API_URL=http://api:8010
    depends_on:
      - api